<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin - AdvEasy Help</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:40px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:40px;
}

.logo{
  height:42px;
}

.save-btn{
  background:#c8a24d;
  color:#fff;
  border:none;
  padding:14px 24px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.save-btn:hover{
  opacity:.9;
}

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:30px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:30px;
  border:1px solid #ececec;
}

.card-title{
  font-size:24px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  margin-bottom:10px;
  font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  outline:none;
}

.form-group textarea{
  min-height:120px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  background:#111827;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:16px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.primary-btn:hover{
  opacity:.95;
}

.pages-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.page-item{
  border:1px solid #ececec;
  border-radius:16px;
  padding:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.page-left{
  display:flex;
  align-items:center;
  gap:15px;
}

.page-left img{
  width:52px;
  height:52px;
  object-fit:contain;
  background:#111827;
  border-radius:12px;
  padding:10px;
}

.page-name{
  font-size:18px;
  font-weight:600;
}

.page-desc{
  color:#64748b;
  margin-top:4px;
}

.action-buttons{
  display:flex;
  gap:10px;
}

.edit-btn,
.delete-btn{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.edit-btn{
  background:#c8a24d;
  color:#fff;
}

.delete-btn{
  background:#ef4444;
  color:#fff;
}

.questions-area{
  margin-top:40px;
}

.question-item{
  border:1px solid #ececec;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
}

.question-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:15px;
}

.question-answer{
  color:#475569;
  line-height:28px;
  margin-bottom:20px;
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#94a3b8;
}

@media(max-width:980px){

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding:20px;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="header">

    <img
      src="https://adveasy.com.br/wp-content/uploads/2023/01/result-3.svg"
      class="logo"
    >

    <button class="save-btn" onclick="saveData()">
      Salvar Atualizações
    </button>

  </div>

  <div class="grid">

    <!-- LEFT -->

    <div class="card">

      <h2 class="card-title">
        Nova Página
      </h2>

      <div class="form-group">

        <label>Link do Ícone</label>

        <input
          type="text"
          id="pageIcon"
          placeholder="https://..."
        >

      </div>

      <div class="form-group">

        <label>Nome da Página</label>

        <input
          type="text"
          id="pageName"
          placeholder="Ex: EasyConnect"
        >

      </div>

      <div class="form-group">

        <label>Descrição</label>

        <textarea
          id="pageDesc"
          placeholder="Texto abaixo do nome"
        ></textarea>

      </div>

      <button class="primary-btn" onclick="createPage()">
        Criar Página
      </button>

      <div class="questions-area">

        <h2 class="card-title">
          Nova Pergunta
        </h2>

        <div class="form-group">

          <label>Selecione a Página</label>

          <select id="questionPage"></select>

        </div>

        <div class="form-group">

          <label>Pergunta</label>

          <input
            type="text"
            id="questionTitle"
            placeholder="Digite a pergunta"
          >

        </div>

        <div class="form-group">

          <label>Resposta</label>

          <textarea
            id="questionAnswer"
            placeholder="Digite a resposta"
          ></textarea>

        </div>

        <button class="primary-btn" onclick="createQuestion()">
          Adicionar Pergunta
        </button>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="card">

      <h2 class="card-title">
        Páginas Criadas
      </h2>

      <div id="pagesContainer" class="pages-list"></div>

    </div>

  </div>

</div>

<script>

let pages = JSON.parse(localStorage.getItem("adveasy_help_pages")) || [];

function saveData(){

  localStorage.setItem(
    "adveasy_help_pages",
    JSON.stringify(pages)
  );

  alert("Atualizado em tempo real!");

}

function createPage(){

  const icon = document.getElementById("pageIcon").value;
  const name = document.getElementById("pageName").value;
  const desc = document.getElementById("pageDesc").value;

  if(!icon || !name || !desc){
    alert("Preencha todos os campos.");
    return;
  }

  const newPage = {
    id: Date.now(),
    icon,
    name,
    desc,
    questions:[]
  };

  pages.push(newPage);

  renderPages();
  updateSelect();
  saveData();

  document.getElementById("pageIcon").value = "";
  document.getElementById("pageName").value = "";
  document.getElementById("pageDesc").value = "";

}

function createQuestion(){

  const pageId = Number(
    document.getElementById("questionPage").value
  );

  const title =
    document.getElementById("questionTitle").value;

  const answer =
    document.getElementById("questionAnswer").value;

  if(!pageId || !title || !answer){
    alert("Preencha todos os campos.");
    return;
  }

  const page = pages.find(p => p.id === pageId);

  page.questions.push({
    id: Date.now(),
    title,
    answer
  });

  renderPages();
  saveData();

  document.getElementById("questionTitle").value = "";
  document.getElementById("questionAnswer").value = "";

}

function deletePage(id){

  if(confirm("Deseja excluir essa página?")){

    pages = pages.filter(p => p.id !== id);

    renderPages();
    updateSelect();
    saveData();

  }

}

function deleteQuestion(pageId, questionId){

  const page = pages.find(p => p.id === pageId);

  page.questions = page.questions.filter(
    q => q.id !== questionId
  );

  renderPages();
  saveData();

}

function editPage(id){

  const page = pages.find(p => p.id === id);

  const newName = prompt("Novo nome:", page.name);

  if(newName){
    page.name = newName;
  }

  renderPages();
  updateSelect();
  saveData();

}

function editQuestion(pageId, questionId){

  const page = pages.find(p => p.id === pageId);

  const question = page.questions.find(
    q => q.id === questionId
  );

  const newQuestion = prompt(
    "Editar pergunta:",
    question.title
  );

  const newAnswer = prompt(
    "Editar resposta:",
    question.answer
  );

  if(newQuestion){
    question.title = newQuestion;
  }

  if(newAnswer){
    question.answer = newAnswer;
  }

  renderPages();
  saveData();

}

function updateSelect(){

  const select =
    document.getElementById("questionPage");

  select.innerHTML = "";

  pages.forEach(page => {

    select.innerHTML += `
      <option value="${page.id}">
        ${page.name}
      </option>
    `;

  });

}

function renderPages(){

  const container =
    document.getElementById("pagesContainer");

  if(pages.length === 0){

    container.innerHTML = `
      <div class="empty">
        Nenhuma página criada.
      </div>
    `;

    return;

  }

  container.innerHTML = "";

  pages.forEach(page => {

    let questionsHTML = "";

    page.questions.forEach(question => {

      questionsHTML += `
      
        <div class="question-item">

          <div class="question-title">
            ${question.title}
          </div>

          <div class="question-answer">
            ${question.answer}
          </div>

          <div class="action-buttons">

            <button
              class="edit-btn"
              onclick="editQuestion(${page.id}, ${question.id})"
            >
              Editar
            </button>

            <button
              class="delete-btn"
              onclick="deleteQuestion(${page.id}, ${question.id})"
            >
              Excluir
            </button>

          </div>

        </div>

      `;

    });

    container.innerHTML += `

      <div class="page-item">

        <div style="width:100%;">

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:flex-start;
              margin-bottom:25px;
            "
          >

            <div class="page-left">

              <img src="${page.icon}">

              <div>

                <div class="page-name">
                  ${page.name}
                </div>

                <div class="page-desc">
                  ${page.desc}
                </div>

              </div>

            </div>

            <div class="action-buttons">

              <button
                class="edit-btn"
                onclick="editPage(${page.id})"
              >
                Editar
              </button>

              <button
                class="delete-btn"
                onclick="deletePage(${page.id})"
              >
                Excluir
              </button>

            </div>

          </div>

          ${questionsHTML || `
            <div class="empty">
              Nenhuma pergunta cadastrada.
            </div>
          `}

        </div>

      </div>

    `;

  });

}

renderPages();
updateSelect();

</script>

</body>
</html>
