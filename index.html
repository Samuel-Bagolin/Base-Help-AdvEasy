<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin - AdvEasy Help</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:40px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:40px;
}

.logo{
  height:42px;
}

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:30px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:30px;
  border:1px solid #ececec;
}

.card-title{
  font-size:24px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:20px;
}

.form-group label{
  display:block;
  margin-bottom:10px;
  font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid #dbe2ea;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  outline:none;
}

.form-group textarea{
  min-height:120px;
}

.primary-btn{
  width:100%;
  background:#111827;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:16px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.pages-list{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.page-item{
  border:1px solid #ececec;
  border-radius:16px;
  padding:20px;
}

.page-left{
  display:flex;
  align-items:flex-start;
  gap:15px;
}

.page-left img{
  width:52px;
  height:52px;
  min-width:52px;
  min-height:52px;
  max-width:52px;
  max-height:52px;
  object-fit:contain;
  background:#111827;
  border-radius:12px;
  padding:10px;
}

.question-item{
  border:1px solid #ececec;
  border-radius:14px;
  padding:18px;
  margin-top:15px;
}

.action-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.edit-btn,
.delete-btn{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.edit-btn{
  background:#c8a24d;
  color:#fff;
}

.delete-btn{
  background:#ef4444;
  color:#fff;
}

.empty{
  padding:60px 20px;
  text-align:center;
  color:#94a3b8;
}

@media(max-width:980px){

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding:20px;
  }

}

</style>

</head>

<body>

<div class="container">

  <div class="header">

    <img
      src="https://adveasy.com.br/wp-content/uploads/2023/01/result-3.svg"
      class="logo"
    >

  </div>

  <div class="grid">

    <!-- LEFT -->

    <div class="card">

      <h2 class="card-title">
        Nova Página
      </h2>

      <div class="form-group">

        <label>Link do Ícone</label>

        <input type="text" id="pageIcon">

      </div>

      <div class="form-group">

        <label>Nome da Página</label>

        <input type="text" id="pageName">

      </div>

      <div class="form-group">

        <label>Descrição</label>

        <textarea id="pageDesc"></textarea>

      </div>

      <button class="primary-btn" onclick="createPage()">
        Criar Página
      </button>

      <div style="margin-top:50px;">

        <h2 class="card-title">
          Nova Pergunta
        </h2>

        <div class="form-group">

          <label>Página</label>

          <select id="questionPage"></select>

        </div>

        <div class="form-group">

          <label>Pergunta</label>

          <input type="text" id="questionTitle">

        </div>

        <div class="form-group">

          <label>Resposta</label>

          <textarea id="questionAnswer"></textarea>

        </div>

        <button class="primary-btn" onclick="createQuestion()">
          Adicionar Pergunta
        </button>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="card">

      <h2 class="card-title">
        Páginas Criadas
      </h2>

      <div id="pagesContainer" class="pages-list"></div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzyUBojyFVXk51F0dHljwu-mXrXO5xTHQ",
  authDomain: "help-adveasy.firebaseapp.com",
  projectId: "help-adveasy",
  storageBucket: "help-adveasy.firebasestorage.app",
  messagingSenderId: "276084634810",
  appId: "1:276084634810:web:b8733e51aeca8db3653e83",
  measurementId: "G-H7Q09XFCP9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let pages = [];

window.createPage = async function(){

  const icon =
    document.getElementById("pageIcon").value;

  const name =
    document.getElementById("pageName").value;

  const desc =
    document.getElementById("pageDesc").value;

  if(!icon || !name || !desc){
    alert("Preencha todos os campos.");
    return;
  }

  await addDoc(collection(db,"pages"),{
    icon,
    name,
    desc,
    questions:[]
  });

  document.getElementById("pageIcon").value = "";
  document.getElementById("pageName").value = "";
  document.getElementById("pageDesc").value = "";

}

window.createQuestion = async function(){

  const pageId =
    document.getElementById("questionPage").value;

  const title =
    document.getElementById("questionTitle").value;

  const answer =
    document.getElementById("questionAnswer").value;

  if(!pageId || !title || !answer){
    alert("Preencha todos os campos.");
    return;
  }

  const page =
    pages.find(p => p.id === pageId);

  page.questions.push({
    id:Date.now(),
    title,
    answer
  });

  await updateDoc(doc(db,"pages",pageId),{
    questions:page.questions
  });

  document.getElementById("questionTitle").value = "";
  document.getElementById("questionAnswer").value = "";

}

window.deletePage = async function(id){

  const confirmDelete =
    confirm("Deseja excluir essa página?");

  if(!confirmDelete) return;

  await deleteDoc(doc(db,"pages",id));

}

window.deleteQuestion = async function(pageId, questionId){

  const page =
    pages.find(p => p.id === pageId);

  page.questions =
    page.questions.filter(
      q => q.id !== questionId
    );

  await updateDoc(doc(db,"pages",pageId),{
    questions:page.questions
  });

}

window.editPage = async function(id){

  const page =
    pages.find(p => p.id === id);

  const newName =
    prompt("Novo nome da página:", page.name);

  if(newName === null) return;

  const newDesc =
    prompt("Nova descrição:", page.desc);

  if(newDesc === null) return;

  const newIcon =
    prompt("Novo link do ícone:", page.icon);

  if(newIcon === null) return;

  await updateDoc(doc(db,"pages",id),{
    name:newName,
    desc:newDesc,
    icon:newIcon
  });

}

window.editQuestion = async function(pageId, questionId){

  const page =
    pages.find(p => p.id === pageId);

  const question =
    page.questions.find(
      q => q.id === questionId
    );

  const newQuestion =
    prompt("Editar pergunta:", question.title);

  const newAnswer =
    prompt("Editar resposta:", question.answer);

  if(!newQuestion || !newAnswer) return;

  question.title = newQuestion;
  question.answer = newAnswer;

  await updateDoc(doc(db,"pages",pageId),{
    questions:page.questions
  });

}

function renderPages(){

  const container =
    document.getElementById("pagesContainer");

  const select =
    document.getElementById("questionPage");

  container.innerHTML = "";
  select.innerHTML = "";

  if(pages.length === 0){

    container.innerHTML = `
      <div class="empty">
        Nenhuma página criada.
      </div>
    `;

    return;

  }

  pages.forEach(page => {

    select.innerHTML += `
      <option value="${page.id}">
        ${page.name}
      </option>
    `;

    let questionsHTML = "";

    page.questions.forEach(question => {

      questionsHTML += `

        <div class="question-item">

          <h3>${question.title}</h3>

          <p style="margin-top:10px;">
            ${question.answer}
          </p>

          <div class="action-buttons">

            <button
              class="edit-btn"
              onclick="editQuestion('${page.id}', ${question.id})"
            >
              Editar
            </button>

            <button
              class="delete-btn"
              onclick="deleteQuestion('${page.id}', ${question.id})"
            >
              Excluir
            </button>

          </div>

        </div>

      `;

    });

    container.innerHTML += `

      <div class="page-item">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            gap:20px;
          "
        >

          <div class="page-left">

            <img src="${page.icon}">

            <div>

              <h2>${page.name}</h2>

              <p style="margin-top:10px;color:#64748b;">
                ${page.desc}
              </p>

            </div>

          </div>

          <div class="action-buttons">

            <button
              class="edit-btn"
              onclick="editPage('${page.id}')"
            >
              Editar
            </button>

            <button
              class="delete-btn"
              onclick="deletePage('${page.id}')"
            >
              Excluir
            </button>

          </div>

        </div>

        ${questionsHTML}

      </div>

    `;

  });

}

onSnapshot(collection(db,"pages"), snapshot => {

  pages = [];

  snapshot.forEach(docItem => {

    pages.push({
      id:docItem.id,
      ...docItem.data()
    });

  });

  renderPages();

});

</script>

</body>
</html>
